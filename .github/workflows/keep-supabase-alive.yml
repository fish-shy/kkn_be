name: Keep Supabase Alive

on:
  schedule:
    # Tiap hari 22:00 UTC (05:00 WITA). Harian, bukan 2x seminggu:
    # jadwal GitHub Actions sering tertunda, dan batas jedanya 7 hari.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API kelurahan
        env:
          API_URL: ${{ secrets.API_URL }}          # https://kkn-api-xxxx.a.run.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}  # sama dengan backend/.env
        run: |
          curl --fail-with-body -sS \
            "${API_URL}/api/keepalive" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
