name: Keep Supabase Alive

on:
  schedule:
    # Runs at midnight (UTC) every Monday and Thursday
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # This allows you to run the script manually

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS -X GET "${SUPABASE_URL}/rest/v1/berita?select=id&limit=1" \
          -H "apikey: ${SUPABASE_KEY}" \
          -H "Authorization: Bearer ${SUPABASE_KEY}"
